name: Refresh Korean holidays

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/holidays.yml'
      - 'scripts/holiday-source.mjs'
      - 'scripts/update-holidays.mjs'

permissions:
  contents: write

concurrency:
  group: official-holiday-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh official holiday data
        env:
          KASI_SERVICE_KEY: ${{ secrets.KASI_SERVICE_KEY }}
        run: node scripts/update-holidays.mjs
      - name: Publish changed holiday data
        run: |
          git add holidays/
          if git diff --cached --quiet; then
            echo 'Official holiday data is current.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh official Korean holiday data'
          git pull --rebase origin main
          git push origin HEAD:main
